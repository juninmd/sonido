name: Publish

on:
  push:
    branches: [main, next]

permissions:
  contents: write # tag, release e CHANGELOG
  issues: write
  pull-requests: write
  id-token: write # npm provenance / trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm com suporte a trusted publishing (OIDC)
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit:ds
      - run: npm test
      - run: npm run build
      - name: Publicar no npm (semantic-release)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: "" # sem token: a autenticação vem do OIDC (trusted publisher)
